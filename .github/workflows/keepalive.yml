name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run wake script
        env:
          STREAMLIT_URL: "https://estime-clermont-app-jq8fmfdn95ggqtukbncztr.streamlit.app/"
        run: node wake-streamlit.js
